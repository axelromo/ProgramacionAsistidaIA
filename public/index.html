<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Diaria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map {
      height: 300px;
      width: 100%;
      border-radius: 0.375rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- Pantalla de Login/Registro -->
  <div id="authScreen" class="container mx-auto px-4 py-8 max-w-md">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">📅 Agenda Diaria</h1>
    
    <div class="bg-white rounded-lg shadow-md p-6">
      <!-- Tabs -->
      <div class="flex mb-6">
        <button id="loginTab" onclick="showLogin()" 
          class="flex-1 py-2 px-4 bg-blue-500 text-white rounded-l-md transition-colors">
          Iniciar Sesión
        </button>
        <button id="registerTab" onclick="showRegister()" 
          class="flex-1 py-2 px-4 bg-gray-200 text-gray-700 rounded-r-md transition-colors">
          Registrarse
        </button>
      </div>
      
      <!-- Formulario de Login -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-gray-600 mb-1">Email *</label>
          <input type="email" id="loginEmail" required 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Contraseña *</label>
          <input type="password" id="loginPassword" required 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" 
          class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition-colors">
          Iniciar Sesión
        </button>
      </form>
      
      <!-- Formulario de Registro -->
      <form id="registerForm" class="space-y-4 hidden">
        <div>
          <label class="block text-gray-600 mb-1">Nombre</label>
          <input type="text" id="registerNombre" 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Email *</label>
          <input type="email" id="registerEmail" required 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Contraseña *</label>
          <input type="password" id="registerPassword" required 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" 
          class="w-full bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600 transition-colors">
          Registrarse
        </button>
      </form>
      
      <div id="authError" class="mt-4 text-red-500 text-center hidden"></div>
    </div>
  </div>
  
  <!-- Pantalla Principal (oculta por defecto) -->
  <div id="mainScreen" class="container mx-auto px-4 py-8 max-w-2xl hidden">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">📅 Agenda Diaria</h1>
      <div class="flex items-center gap-4">
        <span id="userName" class="text-gray-600"></span>
        <button onclick="logout()" 
          class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 transition-colors">
          Cerrar Sesión
        </button>
      </div>
    </div>
    
    <!-- Formulario para agregar evento -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Nuevo Evento</h2>
      <form id="eventoForm" class="space-y-4">
        <div>
          <label class="block text-gray-600 mb-1">Título *</label>
          <input type="text" id="titulo" required 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Fecha *</label>
          <input type="date" id="fecha" required 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Hora</label>
          <input type="time" id="hora" 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Descripción</label>
          <textarea id="descripcion" rows="3" 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Ubicación</label>
          <button type="button" onclick="obtenerUbicacion()" 
            class="w-full bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600 transition-colors mb-2">
            📍 Obtener mi ubicación actual
          </button>
          <div id="map"></div>
          <input type="hidden" id="latitud">
          <input type="hidden" id="longitud">
        </div>
        <button type="submit" 
          class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition-colors">
          Agregar Evento
        </button>
      </form>
    </div>
    
    <!-- Lista de eventos -->
    <div class="bg-white rounded-lg shadow-md p-6">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Eventos</h2>
      <div id="eventosList" class="space-y-3">
        <p class="text-gray-500 text-center">Cargando eventos...</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
