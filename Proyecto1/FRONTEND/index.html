<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Diaria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Configuración para desarrollo
    window.API_URL = 'http://localhost:3000/api';
    
    // Clave publicable de Clerk (Dashboard → API Keys → Publishable key)
    window.CLERK_PUBLISHABLE_KEY = 'pk_test_d2lubmluZy1tb3JheS01LmNsZXJrLmFjY291bnRzLmRldiQ';
  </script>
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_d2lubmluZy1tb3JheS01LmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js"
  ></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- Pantalla de Login/Registro con Clerk -->
  <div id="authScreen" class="container mx-auto px-4 py-8 max-w-md">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">📅 Agenda Diaria</h1>
    <div id="clerk-auth"></div>
  </div>
  
  <!-- Pantalla Principal (oculta por defecto) -->
  <div id="mainScreen" class="container mx-auto px-4 py-8 max-w-2xl hidden">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">📅 Agenda Diaria</h1>
      <div class="flex items-center gap-4">
        <span id="userName" class="text-gray-600"></span>
        <button onclick="logout()" 
          class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 transition-colors">
          Cerrar Sesión
        </button>
      </div>
    </div>
    
    <!-- Formulario para agregar evento -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Nuevo Evento</h2>
      <form id="eventoForm" class="space-y-4">
        <div>
          <label class="block text-gray-600 mb-1">Título *</label>
          <input type="text" id="titulo" required 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Fecha *</label>
          <input type="date" id="fecha" required 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Hora</label>
          <input type="time" id="hora" 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-gray-600 mb-1">Descripción</label>
          <textarea id="descripcion" rows="3" 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <button type="submit" 
          class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition-colors">
          Agregar Evento
        </button>
      </form>
    </div>
    
    <!-- Lista de eventos -->
    <div class="bg-white rounded-lg shadow-md p-6">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Eventos</h2>
      <div id="eventosList" class="space-y-3">
        <p class="text-gray-500 text-center">Cargando eventos...</p>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
